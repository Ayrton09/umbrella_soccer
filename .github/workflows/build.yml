name: Build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rumblefrog/setup-sp@master
        with:
          version: "1.12.x"

      - name: Compile plugin
        run: |
          mkdir -p build
          spcomp -E addons/sourcemod/scripting/umbrella_soccer.sp -o build/umbrella_soccer.smx

      - uses: actions/upload-artifact@v4
        with:
          name: umbrella_soccer
          path: build/umbrella_soccer.smx
